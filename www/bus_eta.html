<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴士到站時間</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #configError {
            color: #b00020;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="configError" hidden></div>
        <table>
            <thead>
                <tr>
                    <th>站頭</th>
                    <th>路線</th>
                    <th>方向</th>
                    <th>倒時</th>
                </tr>
            </thead>
            <tbody id="busData"></tbody>
        </table>
    </div>

    <script type="module">
        import { fetchRows, validateConfig } from "./buseta.js";

        const FIELDS = ["stopName", "route", "destination", "remainingMinutes"];

        function renderRows(rows) {
            const body = document.getElementById("busData");
            body.replaceChildren(...rows.map((row) => {
                const tr = document.createElement("tr");
                for (const field of FIELDS) {
                    const td = document.createElement("td");
                    td.textContent = row[field];
                    tr.appendChild(td);
                }
                return tr;
            }));
        }

        async function refresh(config) {
            try {
                renderRows(await fetchRows(config));
            } catch (error) {
                console.error("無法獲取巴士數據：", error);
            }
        }

        async function start() {
            let config;
            try {
                const response = await fetch("./config.json", { cache: "no-store" });
                if (!response.ok) throw new Error(`config.json: HTTP ${response.status}`);
                config = validateConfig(await response.json());
            } catch (error) {
                const box = document.getElementById("configError");
                box.textContent = `設定錯誤 / Config error: ${error.message}`;
                box.hidden = false;
                return;
            }
            refresh(config);
            setInterval(() => refresh(config), config.refresh_seconds * 1000);
        }

        start();
    </script>
</body>
</html>
