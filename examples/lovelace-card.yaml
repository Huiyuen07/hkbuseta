# 加入 dashboard 的卡片 / card for your dashboard
type: custom:buseta-card
title: 巴士預計到站時間
refresh_seconds: 30
max_minutes: 30
# 出門時間，0 為關閉 / leaving time, 0 turns it off
leave_minutes: 5
# auto、mono、led、icehouse
color_scheme: auto
# auto（跟隨 HA / follow HA）、tc（繁體）、sc（简体）、en
language: tc
grid_options:
  columns: full
  rows: 8
stops:
  # 不寫 routes：顯示該站所有路線 / no routes: every route at the stop
  - operator: kmb
    stop_id: C88E34E485B43EFB
  # 寫 dir：只顯示該方向 / with dir: only that direction
  - operator: ctb
    stop_id: "002403"
    routes:
      - route: "1"
        dir: I
